# Publishes @instructionalai/ecosystem-kit to npm on tag push (v*).
# Uses npm trusted publishing (OIDC) — no stored npm token.
# Configure the trusted publisher on npmjs.com: package settings →
# Trusted Publisher → GitHub Actions → ruchir-code/ecosystem-kit, publish.yml.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish
